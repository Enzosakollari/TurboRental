<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Reset Password Page
        </title>
        <link rel="stylesheet" href="css/resetPassword.css">

    </head>
    <body>
        <video class="login-video" autoplay muted loop playsinline id="loginVideo">
            <source src="/Makina/video/login.mp4" type="video/mp4">
        </video>
        <div class="auth-shell">
            <div class="auth-card">
                <form id="form">
                    <h1 id="header">Reset password</h1>

                    <label id="mesazhi">Confirm the code you received by email</label>

                    <input type="number" id="input" placeholder="6-digit code">

                    <button id="konfirmo">CONFIRM</button>
                    <button id="ridergoKodin">RESEND CODE</button>
                    <a href="login.html" id="kthehuTeLogin">BACK TO LOGIN</a>
                </form>
            </div>
        </div>
        <script>
            document.getElementById('ridergoKodin').addEventListener('click', function(event) {
                
                event.preventDefault();
                const button = event.target;
                button.disabled = true;
                fetch('registerLogin.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: JSON.stringify({action: "sendVerificationCode"})
                    
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert("A new verification code has been sent to your email.");
                    } else {
                        alert("Error: " + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert("An error occurred while sending the code by email.");
                })
                .finally(() => {
                    button.disabled = false;
                });
            });

            document.getElementById("konfirmo").addEventListener("click", function(event){
                event.preventDefault();
                const enteredCode = document.getElementById("input").value;
                
                const codeRegex = /^\d{6}$/;

                if (!codeRegex.test(enteredCode)) {
                    alert("The code must be 6 digits.");
                    return;
                }
                
                fetch("verifyEmail.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ verificationCode: enteredCode, verify: false, action: "verifyEmail"})
                })
                .then(response => response.json())
                .then(data => {
                    console.log(data);
                    if (data.success) {
                        window.location.href = "resetPassword.html";
                    } else {
                        alert("Error: " + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
 
            });

        </script>

        <script>
            const loginVideo = document.getElementById("loginVideo");
            if (loginVideo) {
                loginVideo.playbackRate = 0.75;
            }
        </script>
        <script src="sessionTimeout.js"></script>


    </body>
</html>
