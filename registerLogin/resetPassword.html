<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Reset Password Page
        </title>
        <link rel="stylesheet" href="css/resetPassword.css">

    </head>
    <body>
        <video class="login-video" autoplay muted loop playsinline id="loginVideo">
            <source src="/Makina/video/login.mp4" type="video/mp4">
        </video>
        <div class="auth-shell">
            <div class="auth-card">
                <form id="form">
                    <h1 id="header">Reset password</h1>

                    <label id="mesazhi">Enter a new password</label>

                    <label>Password</label>
                    <input type="password" id="input" placeholder="Enter 8 or more characters">

                    <label>Confirm password</label>
                    <input type="password" id="confirmInput" placeholder="Enter 8 or more characters">

                    <button id="konfirmo">CONFIRM</button>
                    <a href="login.html" id="kthehuTeLogin">BACK TO LOGIN</a>
                </form>
            </div>
        </div>
        
        <script>

            document.getElementById("konfirmo").addEventListener("click", function(event){
                event.preventDefault();
                

                const password = document.getElementById("input").value;
                const confirmPassword = document.getElementById("confirmInput").value;

                const passwordRegex = /^(?=.*[A-Za-z])(?=.*[-._!#$%&?])[A-Za-z\d!#$%&?]{8,255}$/;
                if (!passwordRegex.test(password)) {
                    alert("Password must be at least 8 characters long and include a letter and a special character.");
                    return;
                }
                if (!passwordRegex.test(confirmPassword)) {
                    alert("Password must be at least 8 characters long and include a letter and a special character.");
                    return;
                }
                
                if (password !== confirmPassword) {
                    alert("Passwords do not match.");
                    return;
                }
                fetch('registerLogin.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ changedPassword: password, action: "changePassword"})
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert("Password changed successfully!");
                        window.location.href = "login.html";
                    } else {
                        alert("Error: " + data.message);
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("An error occurred while changing the password.");
                });
            });
        </script>
        <script>
            const loginVideo = document.getElementById("loginVideo");
            if (loginVideo) {
                loginVideo.playbackRate = 0.75;
            }
        </script>
        <script src="sessionTimeout.js"></script>


    </body>
</html>
